    animation-iteration-count: infinite;  /** Anzahl der Wiederholungen **/
    animation-fill-mode:forwards;
    animation-timing-function: linear;
}

@keyframes grow-shrink {
    0% {  transform: scaleY(1); transform-origin: 153px 12.5px }
    50%   {  transform: scaleY(1.1); transform-origin: 153px 12.5px }
    100%   {  transform: scaleY(1); transform-origin: 153px 12.5px }
}

</style>

