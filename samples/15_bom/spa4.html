<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>SPA</title>
</head>
<body>
    <nav><a href="/home">Home</a> | <a href="/about">About</a> | <a href="/contacts">Contacts</a></nav>
    <h1 id="content"></h1>
    <script>
        const contentElement = document.getElementById("content");
        const pages = {
            home: { content: "Home Page", url: "/home" },
            about: { content: "About Page", url: "/about" },
            contacts: { content: "Contact Page", url: "/contacts" }
        };

        function handleClick(event){
            const url = event.target.getAttribute("href");
            const pageName = url.split("/").pop();
            const page = pages[pageName];
            if(history.state?.url != url) {
                contentElement.textContent = page.content;
                history.pushState(page, event.target.textContent, event.target.href);
                document.title = event.target.textContent;
            }
            return event.preventDefault();
        }

        // чтение текущего URL при загрузке
        function loadPageFromUrl() {
            const currentPath = window.location.pathname;
            const pageName = currentPath.split("/").pop() || 'home';
            const page = pages[pageName] || pages.home;

            contentElement.textContent = page.content;
            history.replaceState(page, page.title || 'Home', page.url);
        }

        window.addEventListener("popstate", (event) => {
            if(event.state) {
                contentElement.textContent = event.state.content;
            }
        });

        const links = document.getElementsByTagName("a");
        for (let i = 0; i < links.length; i++) {
            links[i].addEventListener("click", handleClick, true);
        }

        // Инициализация по текущему URL вместо жесткого Home
        loadPageFromUrl();
    </script>
</body>
</html>
