<html lang="ru"><head>
    <title>Проверка кроссбраузерности — image-set() — Дока</title>

    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        padding: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #18191C;
        font-family: "Roboto", sans-serif;
        font-size: 16px;
        color: #ffffff;
      }

      @media (max-width: 640px) {
        body {
          padding: 30px;
        }
      }

      h2 {
        text-align: center;
        margin-bottom: 17px;
        font-weight: 500;
        font-size: 1.375rem;
      }

      .container {
        display: flex;
        gap: 30px;
        max-width: 100%;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
      }

      .title-picture {
        color: #F498AD;
      }

      .title-preview {
        color: #2E9AFF;
      }

      .picture {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .preview {
        width: 300px;
        height: 240px;
  
        background-image: url('../../img/bg@1x.png');

        /* Для Chrome и Safari */
        background-image: -webkit-image-set(
          url('../../img/bg@2x.webp') 2x,
          url('../../img/bg@1x.webp') 1x,
          url('../../img/bg@2x.jpg') 2x,
          url('../../img/bg@1x.jpg') 1x,
          url('../../img/bg@2x.png') 2x,
          url('../../img/bg@1x.png') 1x
        );

        /* Для Firefox */
        background-image: image-set(
          url('../../img/bg@2x.avif') type('image/avif') 2x,
          url('../../img/bg@1x.avif') type('image/avif') 1x,
          url('../../img/bg@2x.webp') type('image/webp') 2x,
          url('../../img/bg@1x.webp') type('image/webp') 1x,
          url('../../img/bg@2x.jpg') type('image/jpeg') 2x,
          url('../../img/bg@1x.jpg') type('image/jpeg') 1x,
          url('../../img/bg@2x.png') type('image/png') 2x,
          url('../../img/bg@1x.png') type('image/png') 1x
        );

        background-size: contain;
        background-repeat: no-repeat;
        max-width: 100%;
        aspect-ratio: 1 / 1;
      }
    </style>
