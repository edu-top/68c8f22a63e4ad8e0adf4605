<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Скрывающееся меню</title>
  <style>
    #menu {
      background: #f0f0f0;
      border: 2px solid #333;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }
    #menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #menu li {
      padding: 8px 0;
      cursor: pointer;
    }
    #menu li:hover {
      background: #e0e0e0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="menu">
  <h3>📋 Меню</h3>
  <ul>
    <li>🏠 Главная</li>
    <li>🔧 Настройки</li>
    <li>📧 Сообщения</li>
    <li>👤 Профиль</li>
    <li>🚪 Выход</li>
  </ul>
</div>

<button onclick="hideMenu()">Hide menu()</button>

<script>
  // Функция hideMenu() генерирует событие "hide"
  function hideMenu() {
    let event = new CustomEvent("hide", {
      cancelable: true // Обязательно для работы preventDefault()
    });

    if (!menu.dispatchEvent(event)) {
      alert('Скрытие меню отменено обработчиком!');
    } else {
      menu.hidden = true;
      console.log('Меню скрыто');
    }
  }

  // Подписываемся на событие "hide" - можем отменить скрытие
  let menu = document.getElementById('menu');
  menu.addEventListener('hide', function(event) {
    if (confirm('Скрыть меню? Нажмите "Отмена", чтобы предотвратить скрытие')) {
      // Разрешаем скрытие
      console.log('Пользователь согласен скрыть меню');
    } else {
      event.preventDefault(); // Отменяем действие по умолчанию
      console.log('preventDefault() вызван - меню остается видимым');
    }
  });
</script>

</body>
</html>
